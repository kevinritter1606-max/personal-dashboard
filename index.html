<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schicht- und Linienübersicht</title>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bayer-blue: #0091df;
      --bg-gray: #f4f6f9;
      --team-1: #0091df; /* Blau */
      --team-2: #f59e0b; /* Gelb */
      --team-3: #10b981; /* Grün */
      --team-4: #f43f5e; /* Rot/Rosa */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background-color: var(--bg-gray); min-height: 100vh; display: flex; flex-direction: column; }

    .brand-gradient { height: 6px; background: linear-gradient(90deg, #0091df 0%, #00bcff 50%, #89d329 100%); width: 100%; }

    header {
      background: #ffffff;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    h1 { font-size: 1.35rem; color: var(--bayer-blue); font-weight: 700; }
    .live-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: #166534; }
    .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.7; } }

    main { padding: 18px; flex: 1; display: flex; overflow-x: auto; }
    .board-container { flex: 1; background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow-x: auto; }
    .board-table { width: 100%; border-collapse: collapse; min-width: 1200px; }
    .board-table th, .board-table td { border: 1px solid #e2e8f0; vertical-align: top; }

    .line-header { background: #f8fafc; padding: 10px 8px; text-align: center; min-width: 145px; }
    .line-title { font-size: 1rem; font-weight: 700; color: #0f172a; }
    
    .badge-container { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 4px; }
    .line-prio { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; font-weight: 700; color: #334155; }
    .line-prio.prio-high { background: #fee2e2; color: #b91c1c; }
    .line-prio.prio-mid { background: #fef3c7; color: #b45309; }
    .line-status-tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: #fecdd3; color: #9f1239; font-weight: 700; }
    .line-notes { font-size: 0.75rem; color: #475569; margin-top: 6px; background: #ffffff; padding: 4px 6px; border-radius: 4px; border: 1px dashed #cbd5e1; white-space: pre-wrap; }

    .shift-header { background: #f1f5f9; font-weight: 700; font-size: 0.95rem; width: 100px; text-align: center; padding: 16px 8px; color: #334155; }
    .drop-zone { padding: 6px; min-height: 110px; display: flex; flex-direction: column; gap: 6px; background: #fafafa; }
